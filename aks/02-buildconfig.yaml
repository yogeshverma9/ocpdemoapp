apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: hello-nodejs-build
  namespace: migration-test
  labels:
    app: hello-ocp
spec:
  source:
    type: Git
    git:
      uri: https://github.com/sclorg/nodejs-ex.git
      ref: master
  strategy:
    type: Source
    sourceStrategy:
      from:
        kind: ImageStreamTag
        namespace: openshift
        name: 'nodejs:18-ubi8'
  output:
    to:
      kind: ImageStreamTag
      name: 'hello-nodejs:latest'
  triggers:
    - type: ConfigChange
    - type: ImageChange
# NOTE:
# BuildConfig (S2I builds) is OpenShift-only. On AKS this build step is
# usually replaced with a CI pipeline (Azure Pipelines / GitHub Actions)
# that builds a container image with Docker/Buildpacks and pushes it to
# Azure Container Registry (ACR). This file references the standard
# public "nodejs-ex" sample repo, purely so the BuildConfig kind has a
# realistic, working example for your conversion tooling to parse.
