apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hello-pvc
  namespace: migration-test
  labels:
    app: hello-ocp
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # storageClassName intentionally omitted to use each cluster's default
  # StorageClass. On OCP this is often "gp3-csi" / "ocs-storagecluster-*";
  # on AKS the default is typically "managed-csi" (Azure Disk), or
  # "azurefile-csi" if shared/multi-node RWX access is required.
