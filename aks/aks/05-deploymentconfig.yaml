apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-openshift
  namespace: migration-test
  labels:
    app: hello-ocp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-ocp
      deploymentconfig: hello-openshift
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: hello-ocp
        deploymentconfig: hello-openshift
    spec:
      containers:
        - name: hello-openshift
          image: docker.io/openshift/hello-openshift:latest
          ports:
            - containerPort: 8080
              protocol: TCP
            - containerPort: 8888
              protocol: TCP
          envFrom:
            - configMapRef:
                name: hello-config
            - secretRef:
                name: hello-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: hello-data
              mountPath: /data
      volumes:
        - name: hello-data
          persistentVolumeClaim:
            claimName: hello-pvc