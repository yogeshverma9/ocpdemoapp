apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  name: hello-openshift
  namespace: migration-test
  labels:
    app: hello-ocp
spec:
  replicas: 2
  selector:
    app: hello-ocp
    deploymentconfig: hello-openshift
  strategy:
    type: Rolling
    rollingParams:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: hello-ocp
        deploymentconfig: hello-openshift
    spec:
      containers:
        - name: hello-openshift
          image: docker.io/openshift/hello-openshift:latest
          ports:
            - containerPort: 8080
              protocol: TCP
            - containerPort: 8888
              protocol: TCP
          envFrom:
            - configMapRef:
                name: hello-config
            - secretRef:
                name: hello-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: hello-data
              mountPath: /data
      volumes:
        - name: hello-data
          persistentVolumeClaim:
            claimName: hello-pvc
  triggers:
    - type: ConfigChange
    - type: ImageChange
      imageChangeParams:
        automatic: true
        containerNames:
          - hello-openshift
        from:
          kind: ImageStreamTag
          name: 'hello-openshift:latest'
# NOTE:
# DeploymentConfig is OpenShift-only. The AKS/K8s equivalent is a
# standard "Deployment" (apps/v1). Migration considerations:
#   - ImageChange/ConfigChange triggers -> handled by CI/CD updating the
#     image tag and re-applying the Deployment (no built-in trigger).
#   - rollingParams (maxSurge/maxUnavailable) map directly onto
#     Deployment's spec.strategy.rollingUpdate fields.
